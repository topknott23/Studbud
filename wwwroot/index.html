<!DOCTYPE html>
<html lang="en" class="dark" data-theme="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studbud — Study Planner & Pomodoro</title>
    <base href="/" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="StudyPomodoroDashboard.styles.css" rel="stylesheet" />
</head>

<body class="bg-[#F8FAFC] dark:bg-[#0B0D14] text-slate-800 dark:text-[#EDEDED] font-sans antialiased min-h-screen transition-colors duration-200">
    <div id="app">
        <div class="min-h-screen flex flex-col items-center justify-center bg-[#0B0D14] text-[#EDEDED]">
            <div class="w-10 h-10 rounded-xl bg-[#121520] border border-[#1E2337] flex items-center justify-center mb-3">
                <div class="w-3 h-3 rounded-full bg-indigo-500 animate-ping"></div>
            </div>
            <p class="text-xs text-[#949BAF]">loading, js wait a bit plzz</p>
        </div>
    </div>

    <div id="blazor-error-ui" class="hidden fixed bottom-4 right-4 bg-rose-600 text-white px-4 py-3 rounded-xl shadow-lg z-50 text-sm font-medium flex items-center gap-3">
        <span>An unhandled error has occurred.</span>
        <a href="." class="underline font-bold text-white hover:text-rose-100">Reload</a>
    </div>

    <!-- Core Scripts -->
    <script src="js/study-helper.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    
    <!-- Tailwind CSS Script -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                        mono: ['Geist Mono', 'ui-monospace', 'monospace'],
                    },
                    colors: {
                        studbud: {
                            50: '#f5f7ff',
                            100: '#ebf0fe',
                            200: '#d6e0fd',
                            300: '#b3c7fc',
                            400: '#8aa6f9',
                            500: '#6382f6',
                            600: '#4f66eb',
                            700: '#3e4ecf',
                            800: '#333fa8',
                            900: '#2d3784',
                            950: '#1b204e',
                        },
                        dark: {
                            bg: '#0B0D14',
                            card: '#121520',
                            cardHover: '#171B2A',
                            border: '#1E2337',
                            borderHover: '#2E3654',
                            text: '#EDEDED',
                            muted: '#949BAF'
                        }
                    },
                    boxShadow: {
                        'glow-indigo': '0 0 25px -5px rgba(99, 102, 241, 0.3)',
                        'glow-emerald': '0 0 25px -5px rgba(16, 185, 129, 0.3)',
                        'glow-amber': '0 0 25px -5px rgba(245, 158, 11, 0.3)',
                        'glow-rose': '0 0 25px -5px rgba(244, 63, 94, 0.3)',
                    }
                }
            }
        }
    </script>
</body>

</html>
