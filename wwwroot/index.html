<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Planner & Pomodoro Dashboard</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="StudyPomodoroDashboard.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0B0F19; color: #F9FAFB; font-family: 'Plus Jakarta Sans', sans-serif;">
            <div style="width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #6366F1, #8B5CF6); display: flex; align-items: center; justify-content: center; margin-bottom: 1.25rem; box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
            </div>
            <h2 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 0.35rem; letter-spacing: -0.02em;">StudyFlow Dashboard</h2>
            <p style="font-size: 0.85rem; color: #9CA3AF;">Loading workspace...</p>
        </div>
    </div>

    <div id="blazor-error-ui" style="display: none; position: fixed; bottom: 0; left: 0; right: 0; background: #EF4444; color: white; padding: 0.75rem 1.5rem; text-align: center; z-index: 2000;">
        An unhandled error has occurred.
        <a href="." style="color: white; text-decoration: underline; margin-left: 0.5rem;">Reload</a>
    </div>

    <script src="js/study-helper.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
