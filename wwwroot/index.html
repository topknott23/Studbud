<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studbud — Study Planner & Pomodoro</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="StudyPomodoroDashboard.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #090A0F; color: #EDEDED; font-family: 'Inter', sans-serif;">
            <div style="width: 36px; height: 36px; border-radius: 8px; background: #161822; border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; margin-bottom: 1rem;">
                <div style="width: 8px; height: 8px; border-radius: 50%; background: #F43F5E;"></div>
            </div>
            <h2 style="font-size: 1rem; font-weight: 600; margin-bottom: 0.25rem; letter-spacing: -0.02em;">Studbud</h2>
            <p style="font-size: 0.8rem; color: #9094A6;">Loading workspace...</p>
        </div>
    </div>

    <div id="blazor-error-ui" style="display: none; position: fixed; bottom: 0; left: 0; right: 0; background: #EF4444; color: white; padding: 0.75rem 1.5rem; text-align: center; z-index: 2000;">
        An unhandled error has occurred.
        <a href="." style="color: white; text-decoration: underline; margin-left: 0.5rem;">Reload</a>
    </div>

    <script src="js/study-helper.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
